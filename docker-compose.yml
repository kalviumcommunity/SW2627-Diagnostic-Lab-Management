# ==============================================================================
# LabTrack - Diagnostic Lab Management System Docker Compose Configuration
#
# 🔗 Web Portal Link: http://localhost:8080
# 🚀 Quick start:     docker compose up -d --build
# 📜 View logs:       docker compose logs -f
# 🛑 Stop:            docker compose down
# ==============================================================================

services:
  lab-track-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab_track_web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
