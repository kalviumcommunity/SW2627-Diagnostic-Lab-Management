name: LabTrack CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  # ============================================================================
  # Job 1: Code Integrity, Static Analysis & Unit Tests
  # ============================================================================
  analyze-and-test:
    name: 🔍 Static Analysis & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_track

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: 🩺 Environment & Toolchain Inspection
        run: |
          flutter --version
          dart --version
          google-chrome --version

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🎨 Verify Dart Code Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ || echo "Formatting suggestions detected."
        continue-on-error: true

      - name: 🚨 Static Analysis (Zero Errors & Zero Warnings)
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: 🧪 Execute Unit & Widget Tests
        run: flutter test --coverage

  # ============================================================================
  # Job 2: Web Compilation & Headless Chrome Execution Test
  # ============================================================================
  web-chrome-verification:
    name: 🌐 Web Compilation & Chrome Execution
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      CHROME_EXECUTABLE: /usr/bin/google-chrome
    defaults:
      run:
        working-directory: lab_track

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Compile Flutter Web Bundle (Chrome Target)
        run: flutter build web --release

      - name: 🧪 Run Smoke Tests on Headless Chrome
        run: flutter test --platform chrome

      - name: 📤 Archive Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labtrack-web-release
          path: lab_track/build/web
          retention-days: 7

  # ============================================================================
  # Job 3: Multi-Stage Docker Container Build & Smoke Verification
  # ============================================================================
  docker-container-verification:
    name: 🐳 Docker Multi-Stage Build & Container Smoke Test
    runs-on: ubuntu-latest
    needs: web-chrome-verification

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: labtrack:ci-test

      - name: 🚀 Run Container & Verify Nginx Web Serving
        run: |
          docker run -d --name test-app -p 8080:8080 labtrack:ci-test
          HTTP_STATUS="000"
          for i in $(seq 1 15); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Container became ready on attempt $i with HTTP 200"
              break
            fi
            sleep 1
          done
          echo "Received HTTP Status: $HTTP_STATUS"
          docker logs test-app
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed: Container did not respond with HTTP 200"
            exit 1
          fi
          docker stop test-app
          docker rm test-app
