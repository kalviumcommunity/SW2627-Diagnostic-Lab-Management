name: Build Android APK

on:
  push:
    branches: [ main, master, 'Aryan-*', 'feat/*', 'fix/*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build Android Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_track

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🧹 Clean Environment & Resolve Dependencies
        run: |
          rm -f android/local.properties
          flutter clean
          flutter pub get

      - name: 🔑 Output SHA-1 Fingerprints for Firebase Google Login & Auth
        run: |
          cd android
          chmod +x gradlew
          REPORT=$(./gradlew signingReport || true)
          echo "$REPORT"
          echo "### 🔑 Android Signing Fingerprints (Register in Firebase Console)" >> $GITHUB_STEP_SUMMARY
          echo "Copy these fingerprints into **Firebase Console > Project Settings > Your Android App**:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$REPORT" | grep -E "(Variant|Config|Store|Alias|MD5|SHA1|SHA-256)" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 🔨 Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labtrack-release-apk
          path: lab_track/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
