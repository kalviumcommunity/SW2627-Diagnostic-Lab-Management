name: Build Android APK

on:
  push:
    branches: [ main, master, 'Aryan-*', 'feat/*', 'fix/*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build Android Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_track

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🧹 Clean Environment & Resolve Dependencies
        run: |
          rm -f android/local.properties
          flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labtrack-release-apk
          path: lab_track/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
